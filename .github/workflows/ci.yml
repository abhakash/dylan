name: ci

# Action pinning policy: pinned to major tags (v4/v1). For stronger supply-chain
# guarantees, pin each `uses:` to its commit SHA with the major tag as comment.
# renovate/dependabot tracks major-tag updates weekly.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "30 21 * * *" # nightly 03:00 IST
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  checks: write
  actions: read
  security-events: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wrapper-validation:
    name: supply-chain/wrapper
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4

  # ── Static analysis (ktlint + detekt + Android Lint + SQLDelight) ─────────
  lint:
    name: lint
    needs: wrapper-validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          gradle-home-cache-cleanup: true
      # NOTE: gradle.properties sets org.gradle.configuration-cache=true, but the
      # build is not yet configuration-cache compatible — every invocation below
      # intentionally passes --no-configuration-cache until that is fixed.
      - name: ktlint + detekt + Android lint
        run: ./gradlew ktlintCheck detekt :androidApp:lintDebug --no-configuration-cache --continue
      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            **/build/reports/lint-results-debug.html
            **/build/reports/detekt/detekt.html
            **/build/reports/ktlint/**
            **/build/reports/detekt/**
          if-no-files-found: ignore
          retention-days: 14

  # ── Unit + contract tests (JVM) ───────────────────────────────────────────
  test:
    name: test/jvm
    needs: wrapper-validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: JVM tests + probeCi (hermetic, rerun)
        # contractDrift is nightly-only (live catalog) — see nightly/contract-drift.
        run: ./gradlew :shared:jvmTest --rerun-tasks :shared:probeCi --no-configuration-cache
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jvmTest-results
          path: |
            shared/build/test-results/**
            shared/build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 14

  # ── Android debug (presubmit-safe: no signing secrets) ─────────────────
  # Signed prod (R8 APK + AAB) lives in builds.yml (manual / tags), which
  # skips gracefully without keystore secrets instead of failing presubmit.
  android-debug:
    name: android/debug
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # VERSION → versionCode
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Assemble debug
        run: ./gradlew :androidApp:assembleDebug --no-configuration-cache
      - name: Version + checksums
        run: |
          echo "VERSION=$(cat VERSION)"
          ls -lh androidApp/build/outputs/apk/debug/*.apk || true
          sha256sum androidApp/build/outputs/apk/debug/*.apk 2>/dev/null || shasum -a 256 androidApp/build/outputs/apk/debug/*.apk 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: apks-debug
          path: |
            androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 14

  # ── iOS klibs (Kotlin/Native, no Xcode link — cheap gate) ────────────────
  ios-klib:
    name: ios/klib
    needs: wrapper-validation
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Select Xcode 16.2 (pin — FAANG hermetic)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.2"
      - name: Compile iOS klibs
        run: ./gradlew :shared:compileKotlinIosSimulatorArm64 :shared:compileKotlinIosArm64 --no-configuration-cache

  # ── iOS simulator (full Xcode link — FAANG presubmit for Swift) ──────────
  ios:
    name: ios/simulator
    needs: [lint, test]
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Select Xcode 16.2
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.2"
      - name: Cache Kotlin/Native + DerivedData
        # NOTE: shared/build is intentionally NOT cached (stale klibs caused
        # phantom-green simulator links); only konan + DerivedData persist.
        uses: actions/cache@v4
        with:
          path: |
            ~/.konan
            ~/Library/Developer/Xcode/DerivedData
          key: ios-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'shared/build.gradle.kts', 'shared/src/**/*.kt') }}
          restore-keys: ios-${{ runner.os }}-
      - name: Build shared frameworks
        run: ./gradlew :shared:assemble --no-configuration-cache
      - name: xcodebuild simulator (CODE_SIGNING_ALLOWED=NO)
        run: |
          set -o pipefail
          xcodebuild -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.2' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee /tmp/xcode-sim.log
          EXIT=${PIPESTATUS[0]}
          if [ $EXIT -ne 0 ]; then cat /tmp/xcode-sim.log; exit $EXIT; fi
      - name: Upload Xcode logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-logs
          path: |
            ~/Library/Logs/DiagnosticReports/*.ips
            /tmp/xcode-*.log
          if-no-files-found: ignore
          retention-days: 7

  # ── dylan-sign (Go): must build + vet on macOS and Linux ───────────────
  gosign:
    name: gosign/${{ matrix.os }}
    needs: wrapper-validation
    strategy:
      matrix:
        os: [macos-14, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: "1.22"
          cache-dependency-path: tools/dylan-sign/go.sum
      - name: go build + vet + test
        working-directory: tools/dylan-sign
        run: |
          go build ./...
          go vet ./...
          go test ./...

  # ── Nightly live probe (schedule / manual only) ─────────────────────────
  nightly-probe-local:
    name: nightly/probe
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Fast live probe (catalog sanity)
        run: ./gradlew :shared:probeLocal -PprobeFast --no-configuration-cache

  # ── Nightly contract drift (live vs fixtures; NOT presubmit) ────────────
  nightly-contract-drift:
    name: nightly/contract-drift
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Live contract drift (nightly-only)
        run: ./gradlew :shared:contractDrift --no-configuration-cache
