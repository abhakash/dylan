name: ios-free

# Actions SHA-pinned per ci.yml policy.

# Free sideload: builds unsigned .ipa on GitHub (no paid cert).
# You sign locally on Mac with your free Apple ID via Xcode/AltStore.
# Trigger: Actions -> ios-free -> Run workflow -> Download artifact Dylan-unsigned.ipa

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-free
  cancel-in-progress: false

jobs:
  unsigned-ipa:
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Select Xcode 16.2
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: "16.2"

      - name: Build shared frameworks (release)
        run: ./gradlew :shared:assemble

      - name: Build unsigned .app (iphoneos, no signing)
        run: |
          set -o pipefail
          xcodebuild -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee /tmp/xcode-free.log
          EXIT=${PIPESTATUS[0]}
          if [ $EXIT -ne 0 ]; then echo "xcodebuild failed, log:"; cat /tmp/xcode-free.log | tail -n 100; exit $EXIT; fi

      - name: Package unsigned IPA
        run: |
          set -e
          APP=$(find ~/Library/Developer/Xcode/DerivedData -name "iosApp.app" -path "*/Build/Products/Release-iphoneos/*" | head -n1)
          if [ -z "$APP" ]; then APP=$(find . -path "*/Build/Products/Release-iphoneos/iosApp.app" | head -n1); fi
          echo "Found .app: $APP"
          ls -lh "$APP"
          echo "--- app contents ---"
          ls -R "$APP" | head -n 100
          du -sh "$APP"
          test -f "$APP/iosApp" || (echo "ERROR: iosApp binary missing — build produced empty stub"; ls -R ~/Library/Developer/Xcode/DerivedData | head -n 50; exit 1)
          rm -rf /tmp/Payload /tmp/Dylan-unsigned.ipa
          mkdir -p /tmp/Payload
          cp -R "$APP" /tmp/Payload/
          cd /tmp && zip -r Dylan-unsigned.ipa Payload > /dev/null
          ls -lh Dylan-unsigned.ipa
          unzip -l Dylan-unsigned.ipa | head -30
          echo "IPA size $(stat -f%z /tmp/Dylan-unsigned.ipa 2>/dev/null || stat -c%s /tmp/Dylan-unsigned.ipa) bytes"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Dylan-unsigned-ipa
          path: /tmp/Dylan-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Version stamp + sha256
        if: always()
        run: |
          echo "VERSION=$(cat VERSION)"
          if [ -f /tmp/Dylan-unsigned.ipa ]; then
            cp /tmp/Dylan-unsigned.ipa "/tmp/Dylan-unsigned-$(cat VERSION).ipa" || true
            shasum -a 256 /tmp/Dylan-unsigned.ipa
          fi

      - name: Upload Xcode build log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xcode-free-log
          path: /tmp/xcode-*.log
          if-no-files-found: warn
          retention-days: 14
