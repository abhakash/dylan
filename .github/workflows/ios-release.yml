name: ios-release

on:
  workflow_dispatch:
    inputs:
      lane:
        description: "Release lane"
        type: choice
        options: [testflight, adhoc, simulator]
        default: testflight

permissions:
  contents: read

concurrency:
  group: ios-release
  cancel-in-progress: false

jobs:
  ipa:
    if: github.event_name == 'workflow_dispatch'
    name: ios/${{ inputs.lane }}
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Select Xcode 16.2
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.2"

      # ── Signing (only for device lanes) ──────────────────────────────────
      - name: Install Apple certificate + profile (if secrets present)
        if: inputs.lane != 'simulator'
        env:
          CERT_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: |
          if [ -z "$CERT_P12" ]; then echo "No APPLE_CERTIFICATE_P12, skipping signing setup (simulator-style)"; exit 0; fi
          echo "$CERT_P12" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "" build.keychain || true
          security import /tmp/cert.p12 -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision
          security find-identity -v -p codesigning build.keychain

      - name: Build shared frameworks (release)
        run: ./gradlew :shared:assemble --no-configuration-cache

      - name: Archive IPA (adhoc/testflight)
        if: inputs.lane != 'simulator'
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $RUNNER_TEMP/Dylan.xcarchive \
            archive \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} \
            | xcpretty || xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Release -sdk iphoneos -archivePath $RUNNER_TEMP/Dylan.xcarchive archive
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/Dylan.xcarchive \
            -exportPath $RUNNER_TEMP/build \
            -exportOptionsPlist iosApp/exportOptions.plist \
            -allowProvisioningUpdates

      - name: Build simulator (no signing)
        if: inputs.lane == 'simulator'
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO build | xcpretty

      - name: Upload IPA
        if: inputs.lane != 'simulator'
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-${{ inputs.lane }}
          path: |
            ${{ runner.temp }}/build/*.ipa
            ${{ runner.temp }}/Dylan.xcarchive
          if-no-files-found: error
          retention-days: 14

      - name: Upload to TestFlight (fastlane pilot)
        if: inputs.lane == 'testflight'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          # xcrun altool was removed in Xcode 16 — uploads go through App Store
          # Connect API via fastlane pilot (or `xcrun notarytool` for notarization,
          # which is a different flow). Fail clearly when secrets are missing.
          if [ -z "$APPLE_API_KEY" ] || [ -z "$APPLE_API_KEY_ID" ] || [ -z "$APPLE_API_ISSUER_ID" ]; then
            echo "ERROR: TestFlight upload needs APPLE_API_KEY_P8 + APPLE_API_KEY_ID + APPLE_API_ISSUER_ID secrets."
            exit 1
          fi
          echo "$APPLE_API_KEY" | base64 --decode > /tmp/AuthKey.p8
          IPA=$(ls $RUNNER_TEMP/build/*.ipa | head -n1)
          echo "Uploading $IPA via fastlane pilot…"
          gem install fastlane --no-document
          fastlane pilot upload --ipa "$IPA" --api_key_path /tmp/AuthKey.p8 --api_key_id "$APPLE_API_KEY_ID" --issuer_id "$APPLE_API_ISSUER_ID"

      - name: Upload Xcode build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-release-log-${{ inputs.lane }}
          path: /tmp/xcode-*.log
          if-no-files-found: warn
          retention-days: 14

      - name: Cleanup signing material (keychain + p12)
        if: always() && inputs.lane != 'simulator'
        run: |
          rm -f /tmp/cert.p12 /tmp/AuthKey.p8
          security delete-keychain build.keychain || true
