name: release

# Actions SHA-pinned per ci.yml policy.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Semver bump (patch/minor/major)"
        required: true
        default: "patch"
        type: choice
        options: [patch, minor, major]
      dry_run:
        description: "Dry run (no push/tag)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  bump-and-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump VERSION + sync iOS
        run: |
          ./tools/bump-version.sh ${{ inputs.bump }}
          cat VERSION
          cat iosApp/iosApp.xcodeproj/project.pbxproj | grep -E "MARKETING_VERSION|CURRENT_PROJECT_VERSION" | head -n 2

      - name: Verify gates (no UP-TO-DATE)
        run: ./gradlew ktlintCheck detekt :shared:jvmTest --rerun-tasks :shared:probeCi

      - name: Commit, tag and push
        if: ${{ !inputs.dry_run }}
        # NOTE: branch protection on main requires PR + green gates — this direct
        # push needs a "bypass allowances" entry for github-actions[bot], or run
        # with dry_run and open the release PR manually.
        run: |
          VER=$(cat VERSION)
          git add VERSION iosApp/iosApp.xcodeproj/project.pbxproj
          git commit -m "chore(release): v$VER"
          # Signed tag when a GPG key is configured, annotated otherwise.
          if gpg --list-secret-keys 2>/dev/null | grep -q .; then
            git tag -s "v$VER" -m "v$VER"
          else
            echo "No GPG key — falling back to annotated tag (configure signing for -s)"
            git tag -a "v$VER" -m "v$VER"
          fi
          git push origin HEAD:main
          git push origin "v$VER"

      - name: Build release APKs
        run: ./gradlew :androidApp:assembleRelease

      - name: Version stamp
        id: ver
        run: |
          VER=$(cat VERSION)
          SHA=$(git rev-parse --short HEAD)
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Upload release APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-apk-v${{ steps.ver.outputs.ver }}-${{ steps.ver.outputs.sha }}
          path: |
            androidApp/build/outputs/apk/release/*.apk
            androidApp/build/outputs/mapping/release/mapping.txt
