# Dylan detekt profile.
#
# This is a DELTA on top of the packaged defaults: the build sets
# `buildUponDefaultConfig = true`, so every rule not named here keeps its
# detekt default (`active: true`, default thresholds). Do not re-declare a rule
# as `active: false` to silence a finding.
#
# There is deliberately no baseline file. This repo used two of them holding
# 245 suppressed findings, which meant the gate was reporting on a small
# fraction of the code and a baseline entry could not distinguish "we
# accepted this" from "nobody ever looked". Both were deleted and
# `detektBaseline` is no longer wired up, so every finding is a build failure.
# If a rule is genuinely wrong for this codebase, change it here, in the open,
# with the reasoning in a comment — do not route around the gate.

build:
  maxIssues: 0

config:
  validation: true

# ── complexity ───────────────────────────────────────────────────────────
complexity:
  # Thresholds are set above the detekt defaults (60/15) on purpose: the shared
  # module already has ~9k LOC of long, branch-heavy provider/repo code. These
  # numbers stop *new* growth without flagging the whole existing surface.
  LongMethod:
    active: true
    threshold: 80
  CyclomaticComplexMethod:
    active: true
    threshold: 20
    ignoreSingleWhenExpression: true
    ignoreSimpleWhenEntries: true
  LongParameterList:
    active: true
    functionThreshold: 12
    constructorThreshold: 12
    ignoreDefaultParameters: true
  TooManyFunctions:
    active: true
    thresholdInFiles: 25
    thresholdInClasses: 25
    thresholdInObjects: 25
    thresholdInInterfaces: 15
    thresholdInEnums: 15
    ignoreOverridden: true

# ── style ────────────────────────────────────────────────────────────────
style:
  MaxLineLength:
    active: true
    maxLineLength: 120
    # NOTE: there is deliberately no `ignoreStrings` here. It is not a property
    # in detekt 1.23.8, and setting an unknown property makes every `detekt`
    # task fail with "invalid config property" — which is easy to misread as a
    # clean run if you only count findings. Check
    # `default-detekt-config.yml` inside detekt-core before adding any option.
    #
    # `Dyl.kt` is exempt because it is Material icon path data: 7 SVG literals
    # of 143-358 chars each, e.g. "M16.5 3c-1.74 0-3.41.81-4.5 2.09…". There is
    # nowhere to wrap them and splitting them with `+` would be unreadable, so
    # the rule cannot be satisfied without damaging the data. `excludeRawStrings`
    # does not rescue it either: each literal carries a trailing comma, so no
    # line is a bare raw-string statement.
    #
    # Scoped to the one file on purpose. Nothing else is exempt, and long prose,
    # long argument lists and long expressions are all still caught everywhere.
    excludes: ['**/android/ui/Dyl.kt']
  MagicNumber:
    active: true
    # Named arguments, annotations (@Composable and friends), ranges, enums and
    # `const val` are the legitimate uses in this codebase.
    ignoreAnnotation: true
    ignoreNamedArgument: true
    ignoreRanges: true
    ignoreEnums: true
    ignoreConstantDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
  ReturnCount:
    active: true
    max: 4
    excludeGuardClauses: true

naming:
  # Composable factories are PascalCase by language contract.
  FunctionNaming:
    ignoreAnnotated:
      - 'Composable'
  TopLevelPropertyNaming:
    active: false

# ── exceptions ───────────────────────────────────────────────────────────
exceptions:
  TooGenericExceptionCaught:
    active: true
    allowedExceptionNameRegex: '_|(ignore|expected|catchAll|swallow).*'
